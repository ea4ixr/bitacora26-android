name: Fabricar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Llave de firma
        env:
          FIRMA_B64: ${{ secrets.FIRMA_B64 }}
        run: |
          if [ -n "$FIRMA_B64" ]; then echo "$FIRMA_B64" | base64 -d > $RUNNER_TEMP/firma.jks; echo "FIRMA_FICHERO=$RUNNER_TEMP/firma.jks" >> $GITHUB_ENV; fi
      - name: Fabricar
        env:
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: gradle --no-daemon assembleRelease
      - name: Renombrar
        run: |
          V=$(grep versionName app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          cp app/build/outputs/apk/release/app-release.apk "Bitacora26-movil-$V.apk"
          echo "V=$V" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: Bitacora26-movil-${{ env.V }}
          path: Bitacora26-movil-*.apk
      - name: Publicar en Releases (pruebas)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "movil-v$V" -y --cleanup-tag || true
          gh release create "movil-v$V" Bitacora26-movil-*.apk --prerelease --title "Bitácora 26 móvil $V (pruebas)" --notes "Versión de pruebas generada automáticamente."
